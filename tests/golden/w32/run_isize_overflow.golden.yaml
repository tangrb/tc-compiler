id: TC-RT-GOLD-0102
kind: run
profile: w32
spec: "§6.3/§13.2.2 signed isize overflow on W=32; §13.1 exit policy"
source: |
  #program
  var a: isize = copy isize, 2147483647
  var b: isize = add isize, a, 1
derivation: |
  Under W=32 isize is a 32-bit two's-complement integer, so INT_MAX + 1 is
   not representable and strict addition traps with TC_RE_INTEGER_OVERFLOW
   (standard §6.3/§13.2.2).
  Exit status is the reference profile's TcExitPolicy: normal termination 0,
  first trap 1 (standard §13.1/§4.9; design §8).  The profile facts are
  documented in src/CONTRACTS.md.
review:
  reviewer: "gate-auditor (independent read-only subagent)"
  reviewer_kind: "independent-agent"
  reviewer_independent: true
  review_kind: "independent derivation audit"
  status: approved
  date: "2026-11-16"
expect:
  stdout_hex: ""
  trap: TC_RE_INTEGER_OVERFLOW
  exit: 1
  termination: trap
