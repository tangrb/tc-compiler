  date: "2026-11-15"
  notes: "Independent derivation audit approved on 2026-11-15; no compiler/VM was run."
expect:
  stage: LEX
  code: TC_CE_SYNTAX
  primary:
    line: 2
    column: 30
  diagnostics: exactly_one
  related: []
