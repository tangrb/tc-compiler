spec: "§4.2 #program 不得使用 Self；§4.8 Self 只在 #lib 中合法；§12.3 TC_CE_PROGRAM_MODE_MISUSE；§12.5.1 误用的 Self 关键字"
source_file: syn_program_mode_self.tc
source: |
  #program
