derivation: |
  §4.2 forbids `Self` in a `#program` module and §4.8 states that `Self` is
  legal only in `#lib`; §12.3 assigns this misuse to
  TC_CE_PROGRAM_MODE_MISUSE (SYN).  §12.5.1 locates the diagnostic at the
  misused `Self` keyword.

  The `Self` token is the first token of line 2, so the primary position is
  line 2, column 1.  Exactly one diagnostic is expected (§12.1 fail-fast).
  No compiler was run to obtain this expectation.
