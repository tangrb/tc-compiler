id: TC-RT-GOLD-0003
kind: run
profile: w64
spec: "§6.10 br/br_if/switch; §7 control-flow forms; §11.2 output bytes"
source: |
  #program
  var i: int32 = copy int32, 0
  var s: int32 = copy int32, 0
  label loop:
  var c: bool = lt int32, i, 5
  _ = br_if c, body
  _ = br done
  label body:
  s = add int32, s, i
  i = add int32, i, 1
  _ = br loop
  label done:
  _ = writeln int32, s
  var k: int32 = copy int32, -3
  _ = switch k, l0, l1, ld
  label l0:
  _ = writeln int32, 0
  _ = br fin
  label l1:
  _ = writeln int32, 1
  _ = br fin
  label ld:
  _ = writeln int32, 2
  _ = br fin
  label fin:
derivation: |
  The loop sums 0+1+2+3+4 = 10.  A negative switch selector is outside
   0..d-1 and selects the final (default) label, printing 2 (standard §6.10).
  Exit status is the reference profile's TcExitPolicy: normal termination 0,
  first trap 1 (standard §13.1/§4.9; design §8).  The profile facts are
  documented in src/CONTRACTS.md.
