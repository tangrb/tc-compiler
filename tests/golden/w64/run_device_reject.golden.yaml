id: TC-RT-GOLD-0008
kind: run
profile: w64
spec: "§6.7 device access; §13.1 environment-defined region table; design §8 TC_DEV_REJECT"
source: |
  #program
  var a: usize = copy usize, 0x20000000
  unsafe then
  var p: ptr<int32> = bitcast ptr<int32>, a
  var x: int32 = load int32, p
  end
derivation: |
  0x20000000 is the first address of the hosted profile's device region.  The
   profile policy is TC_DEV_REJECT, so loading through that address reports
   TC_RE_ADDR_UNAVAILABLE before any target is committed (design §8).
  Exit status is the reference profile's TcExitPolicy: normal termination 0,
  first trap 1 (standard §13.1/§4.9; design §8).  The profile facts are
  documented in src/CONTRACTS.md.
  The device base 0x20000000, its size and TC_DEV_REJECT are the documented
  aarch64-linux-user environment definition (standard §13.1;
  src/CONTRACTS.md); the hosted golden runner selects that profile explicitly.
review:
  reviewer: "gate-auditor (independent read-only subagent)"
  reviewer_kind: "independent-agent"
  reviewer_independent: true
  review_kind: "independent derivation audit"
  status: approved
  date: "2026-11-16"
expect:
  stdout_hex: ""
  trap: TC_RE_ADDR_UNAVAILABLE
  exit: 1
  termination: trap
