# ASan — AddressSanitizer + UndefinedBehaviorSanitizer 构建与全量测试
#
# push / PR 到 master、tc-0.0.* 分支或 v* tag 触发；发现内存错误或 UB 时失败。

name: ASan

on:
  push:
    branches: [master, "tc-0.0.*"]
    tags: ["v*"]
  pull_request:
    branches: [master, "tc-0.0.*"]
  workflow_dispatch:

jobs:
  asan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm qemu-system-arm qemu-system-misc

      - name: Verify required tools
        run: |
          for t in clang llvm-ar ld.lld qemu-system-aarch64 qemu-system-arm qemu-system-riscv32 python3; do
            if command -v "$t" >/dev/null 2>&1; then echo "OK   $t -> $(command -v "$t")"; else echo "MISS $t"; fi
          done

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build with sanitizers
        run: cmake --build build-asan -j "$(nproc)"

      - name: Run full test suite with sanitizers
        # Under sanitizers the 30000-instruction far-branch case multiplies
        # its ~5 GB peak RSS past what hosted runners can host. It still runs
        # in local full verification.
        run: ctest --test-dir build-asan --output-on-failure -E conformance.s10_long_branch
