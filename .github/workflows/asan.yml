# ASan — AddressSanitizer + UndefinedBehaviorSanitizer 构建与全量测试
#
# push / PR 到 master、tc-0.0.* 分支或 v* tag 触发；发现内存错误或 UB 时失败。

name: ASan

on:
  push:
    branches: [master, "tc-0.0.*"]
    tags: ["v*"]
  pull_request:
    branches: [master, "tc-0.0.*"]
  workflow_dispatch:

jobs:
  asan:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu 24.04's qemu 8.2 hangs before the first PL011 byte on
      # aarch64 virt baremetal ELFs (empty uart1, all CPU/serial variants);
      # qemu 10.2 runs the same invocation in ~0.1s. Pin 26.04, whose
      # split packages put riscv in qemu-system-riscv.
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm qemu-system-arm qemu-system-riscv gdb-multiarch

      - name: Verify required tools
        run: |
          for t in clang llvm-ar ld.lld qemu-system-aarch64 qemu-system-arm qemu-system-riscv32 gdb python3; do
            if command -v "$t" >/dev/null 2>&1; then echo "OK   $t -> $(command -v "$t")"; else echo "MISS $t"; fi
          done

      - name: Configure with sanitizers
        run: |
          cmake -S . -B build-asan -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build with sanitizers
        run: cmake --build build-asan -j "$(nproc)"

      - name: Run targeted test runner with leak diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1:log_path=${{ runner.temp }}/tc-lsan
        run: |
          set +e
          ctest --test-dir build-asan -R '^project\.test_runner$' --output-on-failure
          rc=$?
          for log in "$RUNNER_TEMP"/tc-lsan.*; do
            if [ -f "$log" ]; then
              echo "--- $log"
              cat "$log"
            fi
          done
          exit "$rc"
