name: diag-qemu

on:
  workflow_dispatch:
  push:
    branches: ["tc-0.0.*"]
    paths: [".github/workflows/diag-qemu.yml"]

jobs:
  probe-2404:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld qemu-system-arm python3

      - name: QEMU version
        run: qemu-system-aarch64 --version | head -2

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DTC_ENABLE_AOT_TESTS=OFF
          cmake --build build -j "$(nproc)"

      - name: Reproduce hang and variants
        run: |
          python3 - <<'EOF'
          import pathlib, subprocess, sys, tempfile, time
          sys.path.insert(0, "tests")
          from diff import arm32_engine as engine

          src_dir = pathlib.Path(tempfile.mkdtemp(prefix="tc-diag-"))
          src = src_dir / "root.tc"
          src.write_text("#program\n_ = writeln int32, 1\n", encoding="utf-8")
          elf = src_dir / "out.elf"

          t0 = time.monotonic()
          p = subprocess.run(
              [engine.tc_aot_path(), "--profile=aarch64-baremetal", "--emit=elf",
               f"--output={elf}", f"--include={src_dir}",
               f"--ld={engine.lld_path()}", str(src)],
              capture_output=True, timeout=300)
          print(f"build: exit={p.returncode} {time.monotonic()-t0:.1f}s "
                f"stderr={p.stderr.decode(errors='replace')[:200]}")

          def run_variant(label, extra):
              argv = [engine.qemu_aarch64_path(), "-M", "virt", "-cpu", "cortex-a53",
                      "-m", "256M", "-display", "none", "-monitor", "none",
                      "-serial", "stdio", "-serial", f"file:{src_dir}/u_{label}.txt",
                      "-kernel", str(elf)] + extra
              t0 = time.monotonic()
              try:
                  p = subprocess.run(argv, input=b"TCINTCIN" + (0).to_bytes(8, "little"),
                                     stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                     timeout=60)
                  print(f"{label}: exit={p.returncode} {time.monotonic()-t0:.1f}s "
                        f"out={p.stdout[:80]!r}")
              except subprocess.TimeoutExpired:
                  print(f"{label}: TIMEOUT {time.monotonic()-t0:.1f}s")
              u = src_dir / f"u_{label}.txt"
              print(f"  uart1: {u.read_text()[:120]!r}" if u.exists() else "  uart1: (none)")

          run_variant("engine_same", [])
          run_variant("cpu_max", ["-cpu", "max"])
          run_variant("single_serial", ["-serial", "null"])
          EOF

  probe-latest:
    runs-on: ubuntu-latest
    steps:
      - name: OS and qemu package layout
        run: |
          grep PRETTY /etc/os-release
          apt-cache policy qemu-system-arm qemu-system-aarch64 qemu-system-misc 2>&1 | head -20
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-system-misc
          ls -1 /usr/bin/qemu-system-* | head -20
          qemu-system-aarch64 --version | head -2 || echo "MISS qemu-system-aarch64"
