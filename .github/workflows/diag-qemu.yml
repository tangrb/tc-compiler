name: diag-qemu

on:
  workflow_dispatch:
  push:
    branches: ["tc-0.0.*"]
    paths: [".github/workflows/diag-qemu.yml"]

jobs:
  probe-2404-deep:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld qemu-system-arm python3

      - name: QEMU version
        run: qemu-system-aarch64 --version | head -2

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DTC_ENABLE_AOT_TESTS=OFF
          cmake --build build -j "$(nproc)"

      - name: Deep hang diagnosis
        run: |
          python3 - <<'EOF'
          import json, pathlib, socket, subprocess, sys, tempfile, time
          sys.path.insert(0, "tests")
          from diff import arm32_engine as engine

          src_dir = pathlib.Path(tempfile.mkdtemp(prefix="tc-diag-"))
          src = src_dir / "root.tc"
          src.write_text("#program\n_ = writeln int32, 1\n", encoding="utf-8")
          elf = src_dir / "out.elf"

          t0 = time.monotonic()
          p = subprocess.run(
              [engine.tc_aot_path(), "--profile=aarch64-baremetal", "--emit=elf",
               f"--output={elf}", f"--include={src_dir}",
               f"--ld={engine.lld_path()}", str(src)],
              capture_output=True, timeout=300)
          print(f"build: exit={p.returncode} {time.monotonic()-t0:.1f}s", flush=True)

          base = [engine.qemu_aarch64_path(), "-M", "virt", "-cpu", "cortex-a53",
                  "-m", "256M", "-display", "none", "-monitor", "none",
                  "-serial", "stdio", "-serial", f"file:{src_dir}/uart1.txt",
                  "-kernel", str(elf)]
          frame = b"TCINTCIN" + (0).to_bytes(8, "little")

          def spawn(extra):
              out = src_dir / "qout.txt"
              err = src_dir / "qerr.txt"
              return subprocess.Popen(base + extra, stdin=subprocess.DEVNULL,
                                      stdout=open(out, "wb"),
                                      stderr=open(err, "wb"),
                                      cwd=src_dir)

          def qmp_pc(sock_path):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect(sock_path)
              f = s.makefile("rwb")
              greeting = f.readline()
              f.write(b'{"execute":"qmp_capabilities"}\n'); f.flush()
              f.readline()
              f.write(b'{"execute":"query-cpus-fast"}\n'); f.flush()
              resp = json.loads(f.readline())
              s.close()
              return resp

          def query_loop(extra, label):
              sock = src_dir / f"qmp_{label}.sock"
              log = src_dir / f"qlog_{label}.log"
              argv = base + extra + [
                  "-qmp", f"unix:{sock},server,nowait",
                  "-D", str(log), "-d", "in_asm,int,cpu_reset"]
              proc = subprocess.Popen(argv, stdin=subprocess.DEVNULL,
                                      stdout=open(src_dir / "o.txt", "wb"),
                                      stderr=open(src_dir / "e.txt", "wb"),
                                      cwd=src_dir)
              for i in range(3):
                  time.sleep(3)
                  try:
                      print(f"{label} t={3*(i+1)}s pc: {qmp_pc(str(sock))}", flush=True)
                  except Exception as e:
                      print(f"{label} t={3*(i+1)}s qmp-fail: {e!r}", flush=True)
              proc.terminate(); proc.wait(timeout=10)
              tail = log.read_text(errors="replace").splitlines()[-15:]
              print(f"{label} qemu-log tail:", flush=True)
              for line in tail:
                  print(f"  {line}", flush=True)

          def run_variant(label, extra, popen=False):
              if popen:
                  query_loop(extra, label); return
              t0 = time.monotonic()
              try:
                  p = subprocess.run(
                      base + extra,
                      input=frame, stdin=None,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                      timeout=60)
                  print(f"{label}: exit={p.returncode} {time.monotonic()-t0:.1f}s "
                        f"out={p.stdout[:80]!r}", flush=True)
              except subprocess.TimeoutExpired:
                  print(f"{label}: TIMEOUT {time.monotonic()-t0:.1f}s", flush=True)
              u = src_dir / "uart1.txt"
              print(f"  uart1: {u.read_text()[:120]!r}" if u.exists()
                    else "  uart1: (none)", flush=True)

          # 1: exact engine invocation, capture PC and reset/interrupt log
          run_variant("engine_qmp", ["-serial", f"file:{src_dir}/u0.txt"], popen=True)
          # 2: no stdin input at all (bisect stdio serial + stdin frame)
          run_variant("no_stdin", ["-serial", f"file:{src_dir}/u0.txt"])
          # 3: single-threaded TCG
          run_variant("single_thread", ["-accel", "tcg,thread=single",
                                        "-serial", f"file:{src_dir}/u0.txt"])
          EOF

  probe-2604:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OS and qemu package layout
        run: |
          grep PRETTY /etc/os-release
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld qemu-system-arm qemu-system-misc
          ls -1 /usr/bin/qemu-system-riscv* 2>&1 || true
          dpkg -L qemu-system-misc 2>/dev/null | grep riscv | head -5 || true
          qemu-system-aarch64 --version | head -2
          qemu-system-riscv32 --version 2>/dev/null | head -2 || echo "MISS qemu-system-riscv32"

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DTC_ENABLE_AOT_TESTS=OFF
          cmake --build build -j "$(nproc)"

      - name: AOT configure probe
        run: |
          cmake -S . -B build-aot -DCMAKE_C_COMPILER=clang -DTC_ENABLE_AOT_TESTS=ON 2>&1 | tail -15 || true

      - name: Run minimal ELF on qemu 10.2
        run: |
          python3 - <<'EOF'
          import pathlib, subprocess, sys, tempfile, time
          sys.path.insert(0, "tests")
          from diff import arm32_engine as engine

          src_dir = pathlib.Path(tempfile.mkdtemp(prefix="tc-diag-"))
          src = src_dir / "root.tc"
          src.write_text("#program\n_ = writeln int32, 1\n", encoding="utf-8")
          elf = src_dir / "out.elf"

          p = subprocess.run(
              [engine.tc_aot_path(), "--profile=aarch64-baremetal", "--emit=elf",
               f"--output={elf}", f"--include={src_dir}",
               f"--ld={engine.lld_path()}", str(src)],
              capture_output=True, timeout=300)
          print(f"build: exit={p.returncode} stderr={p.stderr.decode(errors='replace')[:200]}", flush=True)

          argv = [engine.qemu_aarch64_path(), "-M", "virt", "-cpu", "cortex-a53",
                  "-m", "256M", "-display", "none", "-monitor", "none",
                  "-serial", "stdio", "-serial", f"file:{src_dir}/uart1.txt",
                  "-kernel", str(elf)]
          t0 = time.monotonic()
          try:
              p = subprocess.run(argv, input=b"TCINTCIN" + (0).to_bytes(8, "little"),
                                 stdout=subprocess.PIPE, stderr=subprocess.PIPE,
                                 timeout=60)
              print(f"engine_same: exit={p.returncode} {time.monotonic()-t0:.1f}s "
                    f"out={p.stdout[:80]!r}", flush=True)
          except subprocess.TimeoutExpired:
              print(f"engine_same: TIMEOUT {time.monotonic()-t0:.1f}s", flush=True)
          u = src_dir / "uart1.txt"
          print(f"  uart1: {u.read_text()[:120]!r}" if u.exists() else "  uart1: (none)", flush=True)
          EOF
