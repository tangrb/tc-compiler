# CD — 按 v* tag 构建并发布 tc-vm / tc-aot 二进制
#
# Linux / macOS 使用系统 gcc/clang；Windows 使用 MSYS2 UCRT64 MinGW
# （AOT --run 依赖 gcc 风格的 host cc，不能用 MSVC）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake gcc

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Configure and build
        run: |
          cmake -S . -B build
          cmake --build build -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Pack binaries
        run: |
          mkdir -p dist
          cp build/vm/bin/tc-vm dist/tc-vm
          cp build/aot/bin/tc-aot dist/tc-aot
          ./dist/tc-vm --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc-${{ matrix.artifact }}
          path: dist/
          retention-days: 14

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure, build, and pack
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc
          cmake --build build -j "$(nproc)"
          mkdir -p dist
          cp build/vm/bin/tc-vm.exe dist/tc-vm.exe
          cp build/aot/bin/tc-aot.exe dist/tc-aot.exe
          ./dist/tc-vm.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc-windows-x86_64
          path: dist/
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-unix, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
