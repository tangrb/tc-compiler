# Release — v* tag 触发，构建并发布 tc-vm / tc-aot
#
# 产物按平台前缀命名（tc-vm-linux-x86_64 等），避免跨平台资产重名导致
# release 资产元数据更新失败。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"

      - name: Verify required tools
        run: |
          for t in clang llvm-ar python3; do
            if command -v "$t" >/dev/null 2>&1; then echo "OK   $t -> $(command -v "$t")"; else echo "MISS $t"; fi
          done

      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DTC_ENABLE_AOT_TESTS=OFF
          cmake --build build -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Smoke test
        run: |
          ./build/src/driver/tc-vm --version
          ./build/src/driver/tc-aot --version

      - name: Pack binaries
        run: |
          mkdir -p dist
          cp build/src/driver/tc-vm dist/tc-vm-${{ matrix.platform }}
          cp build/src/driver/tc-aot dist/tc-aot-${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tc-${{ matrix.platform }}
          path: dist/
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
