# TC-Compiler CI
#
# 触发：push / PR 到 main 分支
# 任务：
#   1. build-and-test — Linux (gcc) + macOS (clang) 构建并运行全部测试
#   2. coverage      — Linux gcc + gcov/lcov 覆盖率收集
#
# 测试组成（make test）:
#   - check-vm    → scripts/vm/run_tests.sh   (198 VM 集成用例)
#   - check-unit  → 各 check-* 单元测试目标    (404 单元用例: lexer/semantics/types/io)
#   - check-aot   → scripts/aot/run_tests.sh   (22 AOT 差分用例)
#
# 参考: docs/改进清单.md 第6项

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ------------------------------------------------------------------ #
  #  构建 + 测试（Linux gcc / macOS clang）                              #
  # ------------------------------------------------------------------ #
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake

    - name: Show toolchain versions
      run: |
        cmake --version
        cc --version | head -1

    - name: Build project (VM + AOT + libtc)
      run: make -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"

    - name: Run all tests (VM conformance + Unit + AOT differential)
      run: make test

    - name: Verify TcRhsKind dispatch coverage
      run: python3 scripts/sync/check_rhs_coverage.py

  # ------------------------------------------------------------------ #
  #  覆盖率收集（Linux gcc + gcov/lcov）                                 #
  # ------------------------------------------------------------------ #
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential lcov

    - name: Configure with coverage flags
      run: |
        cmake -S . -B build-coverage \
          -DCMAKE_C_FLAGS="--coverage -O0 -g" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build with coverage
      run: cmake --build build-coverage -j "$(nproc)"

    - name: Run all tests (generate .gcda files)
      working-directory: build-coverage
      run: |
        cmake --build . --target check-unit 2>&1 || true
        # VM 和 AOT 测试也会生成覆盖率数据
        cmake --build . --target check-vm 2>&1 || true
        cmake --build . --target check-aot 2>&1 || true

    - name: Collect coverage data
      run: |
        lcov --capture --directory build-coverage \
          --output-file build-coverage/coverage_raw.info \
          --rc lcov_branch_coverage=1

        # 排除系统头文件
        lcov --remove build-coverage/coverage_raw.info \
          '/usr/*' '*/tests/*' \
          --output-file build-coverage/coverage.info \
          --rc lcov_branch_coverage=1

    - name: Generate HTML report
      run: |
        genhtml build-coverage/coverage.info \
          --output-directory build-coverage/coverage_html \
          --rc lcov_branch_coverage=1 \
          --title "TC-Compiler Coverage"

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build-coverage/coverage_html/
        retention-days: 7

    - name: Print coverage summary
      run: |
        lcov --summary build-coverage/coverage.info --rc lcov_branch_coverage=1
