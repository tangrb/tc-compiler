# CI — 构建与全量测试
#
# push / PR 到 master、tc-0.0.* 分支或 v* tag 触发。
# 构建无条件要求 clang 与 llvm-ar（freestanding 目标运行时）；完整 ctest
# 还需要 ld.lld、qemu-system-aarch64 / qemu-system-arm / qemu-system-riscv32
# 与 gdb（T2/T3 真实调试器测试），任一缺失时 CMake 配置直接失败
# （不得以部分能力充当通过）。

name: CI

on:
  push:
    branches: [master, "tc-0.0.*"]
    tags: ["v*"]
  pull_request:
    branches: [master, "tc-0.0.*"]
  workflow_dispatch:
    inputs:
      container_digest:
        description: Pinned ubuntu:26.04 digest matching TC_GDB_CONTAINER_DIGEST repository variable
        required: true
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu 24.04's qemu 8.2 hangs before the first PL011 byte on
      # aarch64 virt baremetal ELFs (empty uart1, all CPU/serial variants);
      # qemu 10.2 runs the same invocation in ~0.1s. Pin 26.04, whose
      # split packages put riscv in qemu-system-riscv.
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm qemu-system-arm qemu-system-riscv gdb-multiarch

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld qemu gdb
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Verify required tools
        run: |
          for t in clang llvm-ar ld.lld qemu-system-aarch64 qemu-system-arm qemu-system-riscv32 gdb python3; do
            if command -v "$t" >/dev/null 2>&1; then echo "OK   $t -> $(command -v "$t")"; else echo "MISS $t"; fi
          done

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion"

      - name: Build
        run: cmake --build build -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Run full test suite
        # The 30000-instruction far-branch case peaks near 5 GB RSS during the
        # AOT build; hosted runners are killed by macOS or lose the agent
        # under that pressure. It still runs in local full verification.
        run: python3 tests/run.py --build-dir build --no-build -- -E conformance.s10_long_branch

  gdb-evidence:
    # Manual signed-evidence job for the frozen Linux toolchain.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect real GDB evidence
        env:
          TC_CONTAINER_DIGEST: ${{ inputs.container_digest }}
          TC_APPROVED_CONTAINER_DIGEST: ${{ vars.TC_GDB_CONTAINER_DIGEST }}
        run: |
          if [[ ! "$TC_CONTAINER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "container_digest must be sha256:<64 lowercase hex>" >&2
            exit 2
          fi
          if [[ ! "$TC_APPROVED_CONTAINER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ "$TC_CONTAINER_DIGEST" != "$TC_APPROVED_CONTAINER_DIGEST" ]]; then
            echo "container_digest must match the approved TC_GDB_CONTAINER_DIGEST repository variable" >&2
            exit 2
          fi
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e GITHUB_SHA \
            -e TC_CONTAINER_DIGEST \
            "ubuntu:26.04@${TC_CONTAINER_DIGEST}" \
            bash -lc '
              set -e
              apt-get update -qq
              apt-get install -y -qq ca-certificates clang cmake git lld llvm python3 qemu-system-arm qemu-system-riscv gdb-multiarch
              cmake -S . -B build -DCMAKE_C_COMPILER=clang
              cmake --build build -j "$(nproc)"
              ctest --test-dir build --output-on-failure -R "^vm.gdb.e2e$"
              python3 tests/tools/g11_evidence.py \
                --collect build/gdb-e2e \
                --build-dir build \
                --container-digest "$TC_CONTAINER_DIGEST"
            '

      - name: Attest result.json
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/gdb-e2e/result.json

      - name: Attest transcript.log
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/gdb-e2e/transcript.log

      - name: Verify signed evidence and release audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm gh
          mkdir -p .tmp
          sudo chown "$(id -u):$(id -g)" .tmp
          TMPDIR="$PWD/.tmp" python3 tests/tools/s10_release_audit.py \
            --check \
            --require-g11-evidence=build/gdb-e2e \
            --g11-repo="$GITHUB_REPOSITORY"

      - name: Upload GDB evidence
        uses: actions/upload-artifact@v4
        with:
          name: gdb-e2e-evidence
          path: build/gdb-e2e/
          retention-days: 30
