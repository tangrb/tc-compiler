# CI — 构建与全量测试
#
# push / PR 到 master、tc-0.0.* 分支或 v* tag 触发。
# 构建无条件要求 clang 与 llvm-ar（freestanding 目标运行时）；完整 ctest
# 还需要 ld.lld、qemu-system-aarch64 / qemu-system-arm / qemu-system-riscv32
# 与 gdb（T2/T3 真实调试器测试），任一缺失时 CMake 配置直接失败
# （不得以部分能力充当通过）。

name: CI

on:
  push:
    branches: [master, "tc-0.0.*"]
    tags: ["v*"]
  pull_request:
    branches: [master, "tc-0.0.*"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu 24.04's qemu 8.2 hangs before the first PL011 byte on
      # aarch64 virt baremetal ELFs (empty uart1, all CPU/serial variants);
      # qemu 10.2 runs the same invocation in ~0.1s. Pin 26.04, whose
      # split packages put riscv in qemu-system-riscv.
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld llvm qemu-system-arm qemu-system-riscv gdb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld qemu gdb
          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

      - name: Verify required tools
        run: |
          for t in clang llvm-ar ld.lld qemu-system-aarch64 qemu-system-arm qemu-system-riscv32 gdb python3; do
            if command -v "$t" >/dev/null 2>&1; then echo "OK   $t -> $(command -v "$t")"; else echo "MISS $t"; fi
          done

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-Werror=implicit-function-declaration -Werror=incompatible-pointer-types -Werror=int-conversion"

      - name: Build
        run: cmake --build build -j "$(nproc 2>/dev/null || sysctl -n hw.ncpu)"

      - name: Run full test suite
        # The 30000-instruction far-branch case peaks near 5 GB RSS during the
        # AOT build; hosted runners are killed by macOS or lose the agent
        # under that pressure. It still runs in local full verification.
        run: ctest --test-dir build --output-on-failure -E conformance.s10_long_branch
