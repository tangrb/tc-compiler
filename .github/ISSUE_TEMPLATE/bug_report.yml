name: Bug report / 缺陷报告
description: Report incorrect behavior in TC-VM, TC-AOT, libtc, or TC-Embed / 报告工具链不正确行为
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please include a **minimal** `.tc` reproduction when possible.
        感谢提交缺陷。请尽量附上**最小** `.tc` 复现。

        Security issues: report privately via [SECURITY.md](https://github.com/tangrb/tc-compiler/blob/master/SECURITY.md) ([English](https://github.com/tangrb/tc-compiler/blob/master/SECURITY.en.md)).
        安全漏洞请私下报告，勿开公开 Issue。
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Output of `tc-vm --version`, or git tag / commit SHA.
      placeholder: v0.0.42
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component / 组件
      options:
        - TC-VM
        - TC-AOT
        - libtc
        - TC-Embed
        - Docs / build / CI
        - Unsure / 不确定
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and toolchain / 系统与工具链
      description: e.g. macOS 15 / Ubuntu 24.04, clang or gcc version, CMake version.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction / 最小复现
      description: Smallest `.tc` (or C host snippet for Embed) and the exact command line.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      description: Include stdout and stderr (and exit code if relevant).
    validations:
      required: true
  - type: checkboxes
    id: backends
    attributes:
      label: Backend check / 后端确认
      options:
        - label: Reproduces with TC-VM / 可在 TC-VM 复现
        - label: Reproduces with TC-AOT (`tc-aot` / `--run`) / 可在 TC-AOT 复现
        - label: VM and AOT disagree (describe both outputs above) / VM 与 AOT 不一致
  - type: textarea
    id: extra
    attributes:
      label: Additional context / 补充说明
      description: Links to related issues, logs, or design-doc sections.
